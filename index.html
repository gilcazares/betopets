<!DOCTYPE html>

<!--
  To change the theme, change the class on the html tag below to one of:
  - theme-auto: Automatically switches based on user's system preferences
  - theme-light: Forces light theme
  - theme-dark: Forces dark theme
-->

<html class="theme-auto" lang="en"> <!-- Update `class="theme-auto"` with your preference -->

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Page Title - Change this to your name/brand (50-60 characters recommended) -->
    <title>Beto Pets</title>
    <link rel="icon" type="image/png" href="images/avatar.png"> <!-- Update this with your own favicon -->

    <!-- Meta Description - Write a description (150-160 characters recommended) -->
    <meta name="description" content="Replace this with your own, this appears in search results and when sharing.">

    <!-- Canonical URL - Helps prevent duplicate content issues -->
    <link rel="canonical" href="https://yourwebsite.com">

    <!-- Author Information -->
    <meta name="author" content="Your Name">

    <!-- Browser UI Color - Matches the default light/dark theme backgrounds -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">

    <!-- Social Sharing (Open Graph & Twitter) - Uncomment and fill in to control how your page
         looks when shared on social platforms and in chat apps.
         og:url and og:image must be full absolute URLs. -->
    <!--
    <meta property="og:type" content="website">
    <meta property="og:title" content="Your Name">
    <meta property="og:description" content="A short description of your page.">
    <meta property="og:url" content="https://yourwebsite.com">
    <meta property="og:image" content="https://yourwebsite.com/images/avatar@2x.png">
    <meta name="twitter:card" content="summary">
    -->

    <!-- Font Preloads - Lets the browser fetch fonts in parallel with the stylesheets -->
    <link rel="preload" href="fonts/open-sans-v34-vietnamese_latin-ext_latin_hebrew_greek-ext_greek_cyrillic-ext_cyrillic-regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/open-sans-v34-vietnamese_latin-ext_latin_hebrew_greek-ext_greek_cyrillic-ext_cyrillic-700.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/open-sans-v34-vietnamese_latin-ext_latin_hebrew_greek-ext_greek_cyrillic-ext_cyrillic-800.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/brands.css">

    <!-- LittleLink Extended Stylesheet (Optional) -->
    <!-- <link rel="stylesheet" href="css/brands-extended.css"> -->
    <!-- Learn more at https://github.com/sethcottle/littlelink-extended.
         Remove comments if you've added LittleLink Extended dependencies -->

  </head>

<body>

    <div class="container">
        <div class="column">
          <main>

            <!--
              By default, the Avatar is rounded. Use the following:
              - avatar--rounded: Automatically rounds the image
              - avatar--soft: Slightly rounds the image
              - avatar--none: Removes any rounding

              Be sure to replace the src with your own image path and update the alt text
            -->
            <img class="avatar avatar--rounded" src="images/avatar.png" srcset="images/avatar@2x.png 2x" alt="LittleLink" width="128" height="128" fetchpriority="high">

            <!-- Replace with your name or brand -->
            <h1>Beto Pets</h1>
            <h4>Personalized, loving, and local care for your pets</h4>

            <!-- Add a short description about yourself or your brand -->
            <p>Dog walking ★ Drop-in visits ★ House sitting</p>

            <!-- All your buttons go here -->
            <nav class="button-stack" aria-label="Links">

              <!-- Client Intake Default LittleLink -->
              <a class="button button-default" href="https://form.jotform.com/240825583759166" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/Cat.png" alt="Client Intake Icon">Client Intake</a>

              <!-- Request -->
              <a class="button button-request" href="https://form.jotform.com/241187260989165" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/Dog.png" alt="Service Request Icon">Service Request</a>

              <!-- WhatsApp -->
              <a class="button button-whatsapp" href="https://wa.me/12028101729" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/whatsapp.svg" alt="WhatsApp Logo">WhatsApp</a>
              
              <!-- Generic Email -->
              <a class="button button-email" href="mailto:beto@betopets.com" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/generic-email.svg" alt="Email Icon">Email Us</a>

              <!-- Instagram -->
              <a class="button button-instagram" href="https://www.instagram.com/beto.pets.dc/" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/instagram.svg" alt="Instagram Logo">Instagram</a>

              <div hidden>
              <!-- Gmail -->
              <a class="button button-google-black" href="mailto:beto@betopets.com" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/gmail.svg" alt="Gmail Logo">Gmail</a>

              </div>
              
              <!-- Venmo -->
              <a class="button button-venmo" href="https://account.venmo.com/u/betopets" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/venmo.svg" alt="Venmo Logo">Venmo</a>
              
              <!-- Zelle -->
              <a class="button button-zelle" href="https://www.zelle.com/faq/how-to-use" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/zelle.svg" alt="Zelle Logo">Zelle</a>
                        
              <!-- Generic Phone -->
              <a class="button button-default" href="tel:+12028101729" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/generic-phone.svg" alt="Phone Icon">Call Us</a>

              <!-- Generic Review -->
              <a class="button button-default" href="https://g.page/r/CZa2lxXUnvwyEBM/review" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/generic-review.svg" alt="Review Icon">Leave us a review</a>
  
              <div hidden>
              <!-- Generic SMS -->
              <a class="button button-default" href="#" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/generic-sms.svg" alt="SMS Icon">Send us a message</a>

              </div>
          
      </nav>
      </main>

      <!-- Feel free to add your own footer information, including updating `privacy.html` to reflect how your LittleLink fork is set up -->
      <footer>
        <a href="#">Privacy Policy</a> | Build your own by forking <a href="#" target="_blank" rel="noopener">LittleLink</a>
      </footer>

    </div>
  </div>

</body>

</html>
